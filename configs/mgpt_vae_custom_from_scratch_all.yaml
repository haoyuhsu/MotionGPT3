NAME: mgpt_vae_custom_from_scratch_all # Experiment names
ACCELERATOR: 'gpu' # Devices optioncal: “cpu”, “gpu”, “tpu”, “ipu”, “hpu”, “mps, “auto”
NUM_NODES: 1 # Number of GPU nodes for distributed training
DEVICE: [0] # Index of gpus eg. [0] or [0,1,2,3]

lm_ablation:
  # lm
  motion_holder_repeat: 4
  holder_num_in_input: 4
  motion_holder_seq_mode: 'withse' # 'alone', 'withse'
  with_hid_norm: False
  with_vae_latent_norm: True
  # diffloss
  multi_hidden: True
  guidance_scale: 1.0
  model_guidance_scale: 1.0
  diffusion_batch_mul: 4
  guidance_uncondp: 0.1
  predict_epsilon: True
  fake_latent_mode: 'learnable_zero'  # 'all_zero', 'learnable_rand', 'learnable_zero'
  # mot arch
  mot_factor: 1.0
  attention_mode: 'all'
  
ABLATION:
  SKIP_CONNECT: True
  PE_TYPE: mld
  DIFF_PE_TYPE: mld
  
TRAIN:
  #---------------------------------
  STAGE: lm_m2t # stage "lm_t2m" , "lm_pretrain", "lm_instruct", "lm_finetune", "lm_m2t"
  instruction_type: all # all, t2m, m2t
  #---------------------------------
  NUM_WORKERS: 8 # Number of workers
  BATCH_SIZE: 32 # Size of batches
  # accumulate_grad_batches: 1
  END_EPOCH: 30 # End epoch
  RESUME: '/projects/illinois/eng/cs/shenlong/personals/haoyu/imu-humans/MotionGPT3/experiments/mgpt/mgpt_vae_custom_from_scratch_all' # Resume training from this path
  PRETRAINED: '' # Preatrained model path
  PRETRAINED_VAE: checkpoints/MotionGPT-base/motiongpt_s3_h3d.tar # Vae model path

  LR_SCHEDULER:
    target: CosineAnnealingLR
    params:
      T_max: 1000
      eta_min: 1e-6

  OPTIM:
    target: AdamW
    params:
      lr: 8e-5
      betas: [0.9, 0.99]
      weight_decay: 0.0
    params_diff:
      lr: 1e-4
      betas: [0.9, 0.99]
      weight_decay: 0.0

# Evaluating Configuration
EVAL:
  BATCH_SIZE: 32 # Evaluating Batch size
  SPLIT: val
  # SPLIT: val-train

TEST:
  CHECKPOINTS: experiments/mgpt/mgpt_vae_custom_from_scratch_all/checkpoints/last.ckpt
  # max-R3ep=0 / min-FIDep=0-v1/ last-v1
  SPLIT: test
  BATCH_SIZE: 32 # training Batch size
  REPLICATION_TIMES: 2 # Number of times to replicate the test

DATASET:
  target: motGPT.data.HumanML3D.HumanML3DDataModule
  CODE_PATH: TOKENS
  HUMANML3D:
    CUSTOM_DATASET: "all"  # "humanml" or "lingo" or "all"

METRIC:
  TYPE: ['M2TMetrics']  # TM2TMetrics

LOSS:
  LAMBDA_FEATURE: 1.0
  LAMBDA_VELOCITY: 0.5
  LAMBDA_COMMIT: 0.02
  LAMBDA_CLS: 1.0
  LAMBDA_DIFF: 0.0
  ABLATION:
    RECONS_LOSS: 'l1_smooth'

model:
  target: motGPT.models.mgpt.MotionGPT   # CHANGE: use naive MotionGPT model
  params:
    condition: 'text'
    task: 'm2t'
    lm: ${lm.gpt2}  # CHANGE: use GPT2
    motion_vae: ${vae.vqvae}   # CHANGE: use VQ-VAE
    mot_factor: 1.0
    attention_mode: 'all'
    guidance_scale: ${lm_ablation.model_guidance_scale}
    with_vae_latent_norm: ${lm_ablation.with_vae_latent_norm}
  diff_loss: ${lm.diffloss}

LOGGER:
  TYPE: ['tensorboard', 'wandb']
  VAL_EVERY_STEPS: 5
  WANDB:
    params:
      # offline: True
      # tags: ['local']
      # tags: ['t2m']
      tags: ['m2t']
      project: motiongpt3
